name: Application validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/pause-regression.cjs
      - run: npm ci --ignore-scripts
      - run: npm run build
  python-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The desktop GUI has no automated tests yet; this checks parsing only.
      - run: python -m py_compile main.py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm install --prefix /tmp/pyquake-browser --no-save --no-package-lock playwright@1.56.1
      - run: /tmp/pyquake-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: npm run build
      - name: Check pause and resume in Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/browser-app.log 2>&1 &
          trap 'kill $(jobs -p) || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/browser-app.log; exit 1; fi
          NODE_PATH=/tmp/pyquake-browser/node_modules node tests/browser-pause.cjs
